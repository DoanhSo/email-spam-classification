[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-spam-classification"
version = "0.1.0"
description = "From-scratch binary decision tree for an email spam course project"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
benchmark = ["scikit-learn>=1.4"]

[project.scripts]
spam-detector = "spam_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
